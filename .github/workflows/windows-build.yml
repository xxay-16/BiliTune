name: Windows Build

on:
  push:
    branches: [main, master]
    tags: ['v*.*.*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    name: Build Go + Wails Windows x64
    runs-on: windows-2022
    timeout-minutes: 30
    outputs:
      version: ${{ steps.version.outputs.version }}
      artifact_version: ${{ steps.version.outputs.artifact_version }}
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-go@v6
        with:
          go-version: '1.27.3'
          cache: true
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Read and validate version
        id: version
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          $source = Get-Content internal/model/model.go -Raw
          if ($source -notmatch 'const Version = "([^"]+)"') { throw 'Version missing.' }
          $version = $Matches[1]
          if ($env:REF_TYPE -eq 'tag' -and $env:REF_NAME -ne "v$version") { throw 'Tag must match app version.' }
          "version=$version" >> $env:GITHUB_OUTPUT
          "artifact_version=$version-$($env:GITHUB_SHA.Substring(0,7))" >> $env:GITHUB_OUTPUT
      - name: Install locked dependencies
        run: |
          go mod download
          if ($LASTEXITCODE -ne 0) { throw 'Go dependencies failed.' }
          npm --prefix frontend ci
          if ($LASTEXITCODE -ne 0) { throw 'Frontend dependencies failed.' }
      - name: Check Go formatting
        run: |
          $files = gofmt -l main.go development.go production.go internal
          if ($files) { throw "Run gofmt on: $files" }
      - name: Test backend and frontend
        run: |
          go test ./internal/...
          if ($LASTEXITCODE -ne 0) { throw 'Backend tests failed.' }
          npm --prefix frontend test
          if ($LASTEXITCODE -ne 0) { throw 'Frontend tests failed.' }
          npm --prefix frontend run build
          if ($LASTEXITCODE -ne 0) { throw 'Frontend build failed.' }
      - name: Cache pinned audio runtime and Wails CLI
        uses: actions/cache@v5
        with:
          path: .cache
          key: wails3-0.0-windows-amd64-go1.27.3-mpv652a1dd-v1
      - name: Build Windows desktop
        run: ./scripts/build-windows.ps1 -SkipFrontend
      - name: Exercise real audio runtime
        env:
          BILITUNE_TEST_MPV: '1'
        run: |
          $env:BILITUNE_MPV_PATH = Join-Path $env:GITHUB_WORKSPACE 'bin/libmpv-2.dll'
          go test -count=1 ./internal/player
          if ($LASTEXITCODE -ne 0) { throw 'Audio runtime test failed.' }
      - name: Install Inno Setup
        run: |
          choco install innosetup --no-progress -y
          if ($LASTEXITCODE -ne 0) { throw 'Inno Setup installation failed.' }
      - name: Package EXE and portable ZIP
        env:
          PACKAGE_VERSION: ${{ steps.version.outputs.artifact_version }}
        run: ./scripts/package-windows.ps1 -Version "$env:PACKAGE_VERSION"
      - name: Upload installer
        id: installer
        uses: actions/upload-artifact@v7
        with:
          path: dist/windows/*.exe
          archive: false
          if-no-files-found: error
          retention-days: 30
      - name: Upload portable build
        id: portable
        uses: actions/upload-artifact@v7
        with:
          path: dist/windows/*.zip
          archive: false
          if-no-files-found: error
          retention-days: 30
      - name: Upload checksums
        uses: actions/upload-artifact@v7
        with:
          path: dist/windows/SHA256SUMS.txt
          archive: false
          if-no-files-found: error
          retention-days: 30
      - name: Package summary
        env:
          PACKAGE_VERSION: ${{ steps.version.outputs.artifact_version }}
          INSTALLER_URL: ${{ steps.installer.outputs.artifact-url }}
          PORTABLE_URL: ${{ steps.portable.outputs.artifact-url }}
        run: |
          "### BiliTune Desktop $env:PACKAGE_VERSION" >> $env:GITHUB_STEP_SUMMARY
          "Go + Wails 3.0.0 / Windows x64." >> $env:GITHUB_STEP_SUMMARY
          "[安装版 EXE]($env:INSTALLER_URL) · [免安装 ZIP]($env:PORTABLE_URL)" >> $env:GITHUB_STEP_SUMMARY

  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: windows
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: packages
          merge-multiple: true
          skip-decompress: true
      - name: Publish desktop release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: gh release create "$TAG" packages/* --title "BiliTune Desktop $TAG" --generate-notes --verify-tag
